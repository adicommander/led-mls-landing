<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>MLS ישראל — מערכת CRM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230a0603'/><circle cx='50' cy='50' r='22' fill='%23ff6600'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0805;--panel:#160e07;--card:#1d130a;--card2:#241709;--line:rgba(255,170,80,.14);
  --led:#ff6600;--led2:#ff9900;--text:#f2ece2;--dim:#a3927c;
  --ok:#5dbb63;--bad:#e05252;--blue:#5aa2ff;--purple:#b98bff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Rubik',sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:.95rem}
input,textarea,select{font-family:inherit;font-size:.95rem;color:var(--text);background:#241709;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(255,153,0,.4)}
.btn{background:linear-gradient(90deg,var(--led),var(--led2));color:#1a0d00;font-weight:600;padding:.65rem 1.3rem}
.btn:disabled{opacity:.5;cursor:wait}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);padding:.55rem 1rem}
.btn-sm{padding:.4rem .8rem;font-size:.85rem}
.hidden{display:none!important}
.muted{color:var(--dim);font-size:.85rem}
a{color:var(--led2)}

/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:radial-gradient(60% 50% at 50% 30%,rgba(255,102,0,.09),transparent 70%)}
.auth .card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:2.2rem;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.auth h1{font-size:1.5rem;margin-bottom:.4rem}
.auth h1 b{color:var(--led)}
.auth label{display:block;font-size:.85rem;color:var(--dim);margin:1rem 0 .35rem}
.auth .btn{width:100%;margin-top:1.4rem}
.err{background:rgba(224,82,82,.12);border:1px solid rgba(224,82,82,.4);color:#ff9d9d;border-radius:10px;padding:.6rem .9rem;font-size:.88rem;margin-top:1rem}
.code-input{letter-spacing:.6em;text-align:center;font-size:1.6rem;direction:ltr}

/* shell */
.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--panel);border-inline-end:1px solid var(--line);padding:1.3rem .9rem;display:flex;flex-direction:column;gap:.25rem;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .logo{font-weight:700;font-size:1.1rem;margin-bottom:1.1rem;padding:0 .4rem}
aside .logo b{color:var(--led)}
aside button.nav{background:transparent;color:var(--dim);text-align:start;padding:.65rem .9rem;border-radius:10px;font-size:.95rem;display:flex;gap:.6rem;align-items:center}
aside button.nav.active,aside button.nav:hover{background:rgba(255,102,0,.12);color:var(--text)}
aside .badge-count{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:.05rem .45rem;font-weight:700}
aside .spacer{flex:1}
main{padding:1.6rem;max-width:1300px}
h2.page-title{font-size:1.35rem;margin-bottom:1.2rem}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:.9rem;margin-bottom:1.4rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem}
.stat .n{font-size:1.6rem;font-weight:700;color:var(--led2)}
.stat .n.sm{font-size:1.25rem}
.stat .t{font-size:.8rem;color:var(--dim);margin-top:.15rem}
.panel-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem;margin-bottom:1.4rem}
.panel-box h3{font-size:1rem;margin-bottom:1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* funnel bars */
.funnel-row{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem}
.funnel-row .lbl{width:90px;font-size:.85rem;color:var(--dim);flex-shrink:0}
.funnel-bar{flex:1;background:#2a1a0c;border-radius:6px;height:22px;overflow:hidden}
.funnel-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--led),var(--led2));border-radius:6px}
.funnel-row .v{width:34px;text-align:start;font-size:.85rem;font-weight:600}

/* sparkline */
.spark{width:100%;height:60px;display:block}

/* toolbar / chips / table */
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.toolbar input.search{max-width:240px}
.chip{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;padding:.4rem .9rem;font-size:.83rem}
.chip.active{background:rgba(255,102,0,.16);color:var(--led2);border-color:rgba(255,153,0,.5)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:.7rem .8rem;text-align:start;font-size:.9rem;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:.78rem;background:var(--panel)}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,102,0,.06)}
.status{display:inline-block;border-radius:999px;padding:.18rem .65rem;font-size:.76rem;white-space:nowrap}
.st-new{background:rgba(255,153,0,.15);color:var(--led2)}
.st-contacted{background:rgba(90,162,255,.15);color:var(--blue)}
.st-quoted{background:rgba(185,139,255,.16);color:var(--purple)}
.st-negotiation{background:rgba(255,200,80,.15);color:#ffc850}
.st-won{background:rgba(93,187,99,.16);color:var(--ok)}
.st-lost{background:rgba(224,82,82,.13);color:#ff9d9d}
.tag{display:inline-block;background:rgba(255,170,80,.12);color:var(--dim);border-radius:6px;padding:.05rem .4rem;font-size:.72rem;margin-inline-end:.2rem}

/* kanban */
.kanban{display:flex;gap:.8rem;overflow-x:auto;padding-bottom:1rem}
.kan-col{flex:0 0 250px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.7rem;min-height:200px}
.kan-col.dragover{outline:2px dashed var(--led);outline-offset:-4px}
.kan-col h4{font-size:.85rem;margin-bottom:.2rem;display:flex;justify-content:space-between;align-items:center}
.kan-col .col-sum{font-size:.72rem;color:var(--dim);margin-bottom:.7rem}
.kan-card{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:.65rem;margin-bottom:.55rem;cursor:grab}
.kan-card:active{cursor:grabbing}
.kan-card .nm{font-weight:600;font-size:.9rem}
.kan-card .meta{font-size:.76rem;color:var(--dim);margin-top:.25rem;display:flex;justify-content:space-between;gap:.4rem}
.kan-card .val{color:var(--led2);font-weight:600}

/* centered popup */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9;backdrop-filter:blur(3px)}
.drawer{position:fixed;top:50%;inset-inline-start:50%;transform:translate(50%,-50%);width:min(680px,95vw);max-height:90vh;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 40px 100px rgba(0,0,0,.6);z-index:10;padding:1.6rem;overflow-y:auto;animation:pop .22s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translate(50%,-50%) scale(.94)}to{opacity:1;transform:translate(50%,-50%) scale(1)}}
.drawer .close{position:absolute;top:1rem;inset-inline-end:1rem;background:transparent;color:var(--dim);font-size:1.4rem}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin:.4rem 0 1rem}
.tabs button{background:transparent;color:var(--dim);padding:.5rem .9rem;border-radius:0;font-size:.9rem;border-bottom:2px solid transparent}
.tabs button.active{color:var(--led2);border-bottom-color:var(--led)}
.field{margin:.7rem 0}
.field label{display:block;font-size:.8rem;color:var(--dim);margin-bottom:.3rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.msgbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7rem;margin:.5rem 0;font-size:.88rem;white-space:pre-wrap}
.msgbox .muted{display:block;margin-bottom:.3rem}
.tl-item{display:flex;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.86rem}
.tl-item .dot{width:8px;height:8px;border-radius:50%;background:var(--led);margin-top:.4rem;flex-shrink:0}
.wa{background:#1faa53;color:#fff;font-weight:600;padding:.5rem 1rem;border-radius:10px;text-decoration:none;font-size:.88rem;display:inline-block}
.toast{position:fixed;bottom:1.4rem;inset-inline-start:50%;transform:translateX(50%);background:#241709;border:1px solid var(--line);color:var(--text);padding:.8rem 1.4rem;border-radius:12px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.bulkbar{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem;margin-top:.8rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.task-item{display:flex;gap:.7rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;margin-bottom:.5rem}
.task-item.done{opacity:.5}
.task-item .tt{flex:1}
.task-item.overdue{border-color:rgba(224,82,82,.5)}
.checkbox{width:18px;height:18px;flex-shrink:0;accent-color:var(--led)}
@media(max-width:760px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;border-inline-end:none;border-bottom:1px solid var(--line)}aside .logo{display:none}aside .spacer{display:none}main{padding:1rem}}
</style>

<style id="apple-light">
/* ===== Apple-inspired light redesign — clean, readable, spacious ===== */
:root{
  --bg:#F5F5F7; --panel:#FFFFFF; --card:#FFFFFF; --card2:#F5F5F7;
  --line:#E7E7EC;
  --led:#FF6A1A; --led2:#E5560F;
  --text:#1D1D1F; --dim:#6E6E73;
  --ok:#2E9E4F; --bad:#D93A3A; --blue:#2F6FE0; --purple:#7A5AF0;
}
body{font-family:'Heebo','Assistant',sans-serif;-webkit-font-smoothing:antialiased;color:var(--text);letter-spacing:-0.01em}
h2.page-title{font-weight:700;letter-spacing:-0.02em}
h3,h4{letter-spacing:-0.01em}

/* inputs */
input,textarea,select{background:#FFFFFF;border:1px solid #D9D9E0;border-radius:12px;color:var(--text)}
input::placeholder,textarea::placeholder{color:#9A9AA0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--led);box-shadow:0 0 0 3px rgba(255,106,26,.15)}

/* buttons — Apple pill */
.btn{background:var(--led);color:#fff;border-radius:980px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:filter .15s ease,transform .1s ease}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn-ghost{background:#fff;border:1px solid #D9D9E0;color:var(--text);border-radius:980px}
.btn-ghost:hover{background:#F0F0F3}
.chip{border-radius:980px;border:1px solid #DEDEE4;background:#fff;color:var(--dim);transition:background .12s ease}
.chip:hover{background:#F4F4F6}
.chip.active{background:rgba(255,106,26,.1);color:var(--led2);border-color:rgba(255,106,26,.4)}

/* surfaces & soft shadows */
.stat,.panel-box{border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.03)}
table,.kan-card,.msgbox,.task-item,.bulkbar{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.stat{padding:1.1rem 1.2rem}
.stat .n{color:var(--text);font-weight:700}
.stat .n.sm{color:var(--led2)}
.stat .t{color:var(--dim)}
th{background:#FAFAFC;color:var(--dim);font-weight:600}
td{border-bottom:1px solid #EEEEF2}
tbody tr:hover{background:#FBF7F3}

/* auth */
.auth{background:radial-gradient(60% 50% at 50% 22%,rgba(255,106,26,.06),transparent 70%),#F5F5F7}
.auth .card{box-shadow:0 20px 60px rgba(0,0,0,.1);border-radius:22px}

/* sidebar */
aside{background:#FFFFFF;border-inline-end:1px solid var(--line);box-shadow:1px 0 0 rgba(0,0,0,.03)}
aside .logo b{color:var(--led)}
aside button.nav{border-radius:12px}
aside button.nav.active,aside button.nav:hover{background:rgba(255,106,26,.1);color:var(--text)}

/* funnel + spark */
.funnel-bar{background:#ECECEF}
.funnel-bar i{background:linear-gradient(90deg,var(--led),#FF9243)}

/* kanban */
.kan-col{background:#F0F0F3;border-color:var(--line)}
.kan-col.dragover{outline-color:var(--led)}
.kan-card{background:#fff;border-color:var(--line)}
.kan-card .val{color:var(--led2)}

/* status chips — readable tints on light */
.st-new{background:#FFF0E6;color:#C4551A}
.st-contacted{background:#E8F0FE;color:#1E5FD0}
.st-quoted{background:#F0EAFE;color:#6A45D8}
.st-negotiation{background:#FFF6E0;color:#9A6B00}
.st-won{background:#E6F6EA;color:#217A3B}
.st-lost{background:#FDEBEB;color:#C43333}
.tag{background:#F0F0F3;color:#6E6E73}

/* popup */
.overlay{background:rgba(0,0,0,.28);backdrop-filter:blur(6px)}
.drawer{background:#fff;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.18);border-radius:22px}
.tabs{border-bottom-color:var(--line)}
.tabs button.active{color:var(--led2);border-bottom-color:var(--led)}
.tl-item{border-bottom-color:#EEEEF2}
.tl-item .dot{background:var(--led)}

/* toast — dark HUD (Apple-style notification) */
.toast{background:rgba(28,28,30,.94);color:#fff;border:none;box-shadow:0 12px 40px rgba(0,0,0,.28);backdrop-filter:blur(12px);border-radius:14px}

/* misc */
.badge-count{background:var(--bad)}
.checkbox{accent-color:var(--led)}
code{background:#F0F0F3;color:#C4551A;padding:.05rem .35rem;border-radius:6px;font-size:.85em}

/* date field button */
.datebtn{background:#fff;border:1px solid #D9D9E0;border-radius:12px;color:var(--text);padding:.6rem .8rem;text-align:start;width:100%;font-size:.95rem}
.datebtn.set{border-color:var(--led);color:var(--led2);font-weight:600}

/* hebrew calendar popup */
#cal-wrap .overlay{background:rgba(0,0,0,.3);backdrop-filter:blur(6px)}
.calbox{position:fixed;top:50%;inset-inline-start:50%;transform:translate(50%,-50%);width:min(360px,94vw);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.2);z-index:11;padding:1.2rem;animation:pop .2s cubic-bezier(.2,.9,.3,1.2) both}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.cal-head b{font-size:1.05rem}
.cal-nav{background:#F0F0F3;border-radius:10px;width:34px;height:34px;font-size:1.1rem;color:var(--text)}
.cal-nav:hover{background:#E6E6EB}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:.75rem;color:var(--dim);padding:.3rem 0;font-weight:600}
.cal-cell{aspect-ratio:1;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;color:var(--text);position:relative;padding:0}
.cal-cell:hover{background:#F4F4F6}
.cal-cell.other{color:#c9c9cf}
.cal-cell.today{outline:2px solid var(--led);outline-offset:-2px}
.cal-cell.selected{background:var(--led);color:#fff}
.cal-cell.shabbat{color:#2F6FE0}
.cal-cell .heb{font-size:.58rem;color:var(--dim);line-height:1}
.cal-cell.selected .heb{color:#ffe}
.cal-cell.holiday::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--led)}
.cal-cell.selected.holiday::after{background:#fff}
.cal-holiday-name{text-align:center;font-size:.8rem;color:var(--led2);min-height:1.1rem;margin-top:.5rem;font-weight:600}
.cal-time{display:flex;gap:.4rem;align-items:center;justify-content:center;margin-top:.7rem}
.cal-time select{width:auto;padding:.4rem .6rem}
.cal-actions{display:flex;gap:.5rem;margin-top:.9rem}
.cal-actions .btn{flex:1}
</style>
</head>
<body>

<div id="view-auth" class="auth">
  <div class="card">
    <h1>MLS <b>ישראל</b> · CRM</h1>
    <div id="step-login">
      <p class="muted">כניסה למערכת</p>
      <label>אימייל</label><input id="login-email" type="email" autocomplete="username" dir="ltr">
      <label>סיסמה</label><input id="login-pass" type="password" autocomplete="current-password" dir="ltr">
      <button class="btn" id="btn-login">כניסה</button>
    </div>
    <div id="step-code" class="hidden">
      <p class="muted">שלחנו קוד בן 6 ספרות למייל. <span id="mail-warn" class="hidden" style="color:#ff9d9d">(שליחת המייל נכשלה — הקוד ביומן השרת)</span></p>
      <label>קוד אימות</label><input id="login-code" class="code-input" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
      <button class="btn" id="btn-verify">אימות</button>
      <button class="btn-ghost" style="width:100%;margin-top:.6rem" id="btn-back">חזרה</button>
    </div>
    <div id="step-newpass" class="hidden">
      <p class="muted">נדרשת החלפת סיסמה לפני ההמשך</p>
      <label>סיסמה נוכחית</label><input id="np-current" type="password" dir="ltr">
      <label>סיסמה חדשה (10+ תווים)</label><input id="np-next" type="password" dir="ltr">
      <button class="btn" id="btn-newpass">שמור והמשך</button>
    </div>
    <div id="auth-err" class="err hidden"></div>
  </div>
</div>

<div id="view-app" class="shell hidden">
  <aside>
    <div class="logo">MLS <b>ישראל</b></div>
    <button class="nav active" data-page="dashboard">📊 דשבורד</button>
    <button class="nav" data-page="pipeline">🗂️ פייפליין</button>
    <button class="nav" data-page="leads">📋 לידים</button>
    <button class="nav" data-page="quotes">🧾 הצעות מחיר</button>
    <button class="nav" data-page="tasks">✅ משימות <span id="tasks-badge" class="badge-count hidden">0</span></button>
    <button class="nav" data-page="templates">✉️ תבניות</button>
    <button class="nav" data-page="users" id="nav-users">👥 משתמשים</button>
    <button class="nav" data-page="settings">⚙️ הגדרות</button>
    <div class="spacer"></div>
    <button class="nav" id="btn-logout">↩ יציאה</button>
  </aside>
  <main>
    <div id="page-dashboard"></div>
    <div id="page-pipeline" class="hidden"></div>
    <div id="page-leads" class="hidden"></div>
    <div id="page-quotes" class="hidden"></div>
    <div id="page-tasks" class="hidden"></div>
    <div id="page-templates" class="hidden"></div>
    <div id="page-users" class="hidden"></div>
    <div id="page-settings" class="hidden"></div>
  </main>
</div>

<div id="drawer-wrap" class="hidden">
  <div class="overlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer"></div>
</div>

<div id="cal-wrap" class="hidden">
  <div class="overlay" onclick="closeCal()"></div>
  <div class="calbox" id="calbox"></div>
</div>

<script>
const $=s=>document.querySelector(s);
let ME=null, PRE='', USERS=[], TEMPLATES=[], leadFilter={status:'',q:''}, selected=new Set();

const STAGES=['new','contacted','quoted','negotiation','won','lost'];
const STAGE_HE={new:'חדש',contacted:'יצירת קשר',quoted:'הצעת מחיר',negotiation:'משא ומתן',won:'נסגר בהצלחה',lost:'לא רלוונטי'};
const TASK_ST={open:'פתוח',in_progress:'בטיפול',follow_up:'להמשך טיפול',done:'טופל'};
const TASK_ST_CLASS={open:'st-new',in_progress:'st-contacted',follow_up:'st-negotiation',done:'st-won'};
function userOpts(sel){return '<option value="">— לא משויך —</option>'+USERS.map(u=>`<option value="${u.id}"${u.id===sel?' selected':''}>${esc(u.name||u.email)}</option>`).join('');}

/* ===== Hebrew calendar with Israeli holidays (computed via Hebrew calendar) ===== */
let dateVals={};
let calState={id:null,withTime:false,view:null,sel:null,hh:9,mm:0,onPick:null};
const HEB_MD=new Intl.DateTimeFormat('en-u-ca-hebrew',{month:'long',day:'numeric'});
const HEB_DNUM=new Intl.DateTimeFormat('he-u-ca-hebrew-nu-hebr',{day:'numeric'});
const GREG_MY=new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'});
const DOW=['א','ב','ג','ד','ה','ו','ש'];
const HOLIDAYS={
  'Tishri 1':'ראש השנה','Tishri 2':'ראש השנה','Tishri 10':'יום כיפור',
  'Tishri 15':'סוכות','Tishri 21':'הושענא רבה','Tishri 22':'שמחת תורה',
  'Kislev 25':'חנוכה','Tevet 10':'צום עשרה בטבת','Shevat 15':'ט״ו בשבט',
  'Adar 14':'פורים','Adar II 14':'פורים','Adar 13':'תענית אסתר','Adar II 13':'תענית אסתר',
  'Nisan 15':'פסח','Nisan 21':'שביעי של פסח','Nisan 27':'יום השואה',
  'Iyar 4':'יום הזיכרון','Iyar 5':'יום העצמאות','Iyar 18':'ל״ג בעומר','Iyar 28':'יום ירושלים',
  'Sivan 6':'שבועות','Tammuz 17':'צום י״ז בתמוז','Tamuz 17':'צום י״ז בתמוז','Av 9':'תשעה באב','Av 15':'ט״ו באב'
};
function hebHoliday(d){
  const p=HEB_MD.formatToParts(d);
  const m=p.find(x=>x.type==='month').value, day=p.find(x=>x.type==='day').value;
  return HOLIDAYS[m+' '+day]||null;
}
function dateField(id,label,withTime,initISO){
  dateVals[id]=initISO||'';
  return `<div class="field"><label>${label}</label><button type="button" class="datebtn ${initISO?'set':''}" id="btn-${id}" onclick="openCal('${id}',${withTime?'true':'false'})">${initISO?fmtFieldVal(initISO,withTime):'בחר תאריך'+(withTime?' ושעה':'')}</button></div>`;
}
function fmtFieldVal(iso,withTime){const d=new Date(iso);return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit'})+(withTime?(' · '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})):'');}
function openCal(id,withTime,onPick){
  calState.id=id;calState.withTime=withTime;calState.onPick=onPick||null;
  const cur=(dateVals[id]&&!onPick)?new Date(dateVals[id]):new Date();
  calState.view=new Date(cur.getFullYear(),cur.getMonth(),1);
  calState.sel=(dateVals[id]&&!onPick)?new Date(dateVals[id]):null;
  calState.hh=calState.sel?calState.sel.getHours():9;calState.mm=calState.sel?(Math.round(calState.sel.getMinutes()/15)*15)%60:0;
  renderCal();$('#cal-wrap').classList.remove('hidden');
}
function closeCal(){$('#cal-wrap').classList.add('hidden');}
function calMove(delta){calState.view.setMonth(calState.view.getMonth()+delta);renderCal();}
function renderCal(){
  const v=calState.view,y=v.getFullYear(),m=v.getMonth();
  const startDow=new Date(y,m,1).getDay(),daysIn=new Date(y,m+1,0).getDate(),t0=new Date().toDateString();
  let cells='',selName='';
  for(let i=0;i<startDow;i++)cells+='<button class="cal-cell other" disabled></button>';
  for(let d=1;d<=daysIn;d++){
    const date=new Date(y,m,d),hol=hebHoliday(date),isSat=date.getDay()===6;
    const isToday=date.toDateString()===t0,isSel=calState.sel&&date.toDateString()===calState.sel.toDateString();
    if(isSel)selName=hol||'';
    cells+=`<button class="cal-cell${isSat?' shabbat':''}${isToday?' today':''}${isSel?' selected':''}${hol?' holiday':''}" title="${hol?esc(hol):''}" onclick="calPick(${y},${m},${d})"><span>${d}</span><span class="heb">${HEB_DNUM.format(date)}</span></button>`;
  }
  const timeHtml=calState.withTime?`<div class="cal-time">שעה:
    <select id="cal-hh" onchange="calState.hh=+this.value">${Array.from({length:24},(_,h)=>`<option value="${h}"${h===calState.hh?' selected':''}>${String(h).padStart(2,'0')}</option>`).join('')}</select>:
    <select id="cal-mm" onchange="calState.mm=+this.value">${[0,15,30,45].map(mn=>`<option value="${mn}"${mn===calState.mm?' selected':''}>${String(mn).padStart(2,'0')}</option>`).join('')}</select></div>`:'';
  $('#calbox').innerHTML=`
    <div class="cal-head"><button class="cal-nav" onclick="calMove(-1)">›</button><b>${GREG_MY.format(v)}</b><button class="cal-nav" onclick="calMove(1)">‹</button></div>
    <div class="cal-grid">${DOW.map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
    <div class="cal-holiday-name">${selName?('🎉 '+esc(selName)):''}</div>${timeHtml}
    <div class="cal-actions"><button class="btn" onclick="calConfirm()">בחר</button><button class="btn-ghost" onclick="calClear()">נקה</button></div>`;
}
function calPick(y,m,d){calState.sel=new Date(y,m,d);renderCal();}
function calClear(){const id=calState.id;dateVals[id]='';const b=$('#btn-'+id);if(b){b.textContent='בחר תאריך'+(calState.withTime?' ושעה':'');b.classList.remove('set');}if(calState.onPick)calState.onPick('');closeCal();}
function calConfirm(){
  if(!calState.sel){toast('בחר תאריך');return;}
  const d=calState.sel;let iso;
  if(calState.withTime){d.setHours(calState.hh,calState.mm,0,0);iso=d.toISOString();}
  else iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  dateVals[calState.id]=iso;
  const b=$('#btn-'+calState.id);if(b){b.textContent=fmtFieldVal(iso,calState.withTime);b.classList.add('set');}
  if(calState.onPick)calState.onPick(iso);
  closeCal();
}

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},credentials:'same-origin',...opts});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('שגיאה '+r.status));
  return d;
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
function authErr(m){const e=$('#auth-err');e.textContent=m;e.classList.remove('hidden');}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>s?new Date(s).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit'}):'';
const fmtDT=s=>s?new Date(s).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'}):'';
const money=n=>'₪'+Number(n||0).toLocaleString('he-IL');
const stChip=s=>`<span class="status st-${s}">${STAGE_HE[s]||s}</span>`;

/* ---------- auth ---------- */
$('#btn-login').onclick=async()=>{
  $('#auth-err').classList.add('hidden');const b=$('#btn-login');b.disabled=true;
  try{
    const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('#login-email').value,password:$('#login-pass').value})});
    if(d.ok){ME=d.user;afterLogin();return;}
    PRE=d.pre;$('#step-login').classList.add('hidden');$('#step-code').classList.remove('hidden');
    if(!d.emailSent)$('#mail-warn').classList.remove('hidden');$('#login-code').focus();
  }catch(e){authErr(e.message);}finally{b.disabled=false;}
};
$('#btn-verify').onclick=async()=>{
  $('#auth-err').classList.add('hidden');const b=$('#btn-verify');b.disabled=true;
  try{
    const d=await api('/api/auth/verify',{method:'POST',body:JSON.stringify({pre:PRE,code:$('#login-code').value})});
    ME=d.user;afterLogin();
  }catch(e){authErr(e.message);}finally{b.disabled=false;}
};
$('#btn-back').onclick=()=>{$('#step-code').classList.add('hidden');$('#step-login').classList.remove('hidden');};
$('#btn-newpass').onclick=async()=>{
  $('#auth-err').classList.add('hidden');
  try{await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({current:$('#np-current').value,next:$('#np-next').value})});toast('הסיסמה עודכנה');enterApp();}
  catch(e){authErr(e.message);}
};
$('#btn-logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload();};
function afterLogin(){
  if(ME.must_change_password){$('#step-login').classList.add('hidden');$('#step-code').classList.add('hidden');$('#step-newpass').classList.remove('hidden');}
  else enterApp();
}
async function enterApp(){
  $('#view-auth').classList.add('hidden');$('#view-app').classList.remove('hidden');
  if(ME.role!=='admin')$('#nav-users').classList.add('hidden');
  try{USERS=(await api('/api/users')).users;}catch(e){USERS=[ME];}
  try{TEMPLATES=(await api('/api/templates')).templates;}catch(e){TEMPLATES=[];}
  showPage('dashboard');refreshTaskBadge();
}

/* ---------- router ---------- */
document.querySelectorAll('aside button.nav[data-page]').forEach(btn=>{
  btn.onclick=()=>showPage(btn.dataset.page);
});
function showPage(name){
  document.querySelectorAll('aside button.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));
  ['dashboard','pipeline','leads','quotes','tasks','templates','users','settings'].forEach(p=>$('#page-'+p).classList.toggle('hidden',p!==name));
  if(name==='dashboard')loadDashboard();
  if(name==='pipeline')loadPipeline();
  if(name==='leads')loadLeads();
  if(name==='quotes')loadQuotes();
  if(name==='tasks')loadTasks();
  if(name==='templates')loadTemplates();
  if(name==='users')loadUsers();
  if(name==='settings')loadSettings();
}

async function refreshTaskBadge(){
  try{
    const s=await api('/api/stats');
    const n=(s.tasksToday||0)+(s.tasksOverdue||0);
    const b=$('#tasks-badge');b.textContent=n;b.classList.toggle('hidden',!n);
  }catch(e){}
}

/* ---------- dashboard ---------- */
async function loadDashboard(){
  const s=await api('/api/stats');
  const maxFunnel=Math.max(1,...STAGES.map(k=>s.byStatus[k]||0));
  const trendMax=Math.max(1,...(s.trend||[]).map(t=>t.n));
  const pts=(s.trend||[]).map((t,i,a)=>{
    const x=a.length>1?i/(a.length-1)*100:0;const y=60-(t.n/trendMax)*52-4;return `${x},${y}`;
  }).join(' ');
  $('#page-dashboard').innerHTML=`
    <h2 class="page-title">דשבורד</h2>
    <div class="stats">
      <div class="stat"><div class="n">${s.total}</div><div class="t">סה״כ לידים</div></div>
      <div class="stat"><div class="n">${s.week}</div><div class="t">חדשים השבוע</div></div>
      <div class="stat"><div class="n sm">${money(s.pipelineValue)}</div><div class="t">שווי פייפליין פתוח</div></div>
      <div class="stat"><div class="n sm">${money(s.forecast)}</div><div class="t">תחזית משוקללת</div></div>
      <div class="stat"><div class="n sm">${money(s.wonValue)}</div><div class="t">נסגר בהצלחה (₪)</div></div>
      <div class="stat"><div class="n">${s.winRate}%</div><div class="t">אחוז זכייה</div></div>
      <div class="stat"><div class="n">${s.quotesOpen||0}</div><div class="t">הצעות מחיר פתוחות</div></div>
      <div class="stat"><div class="n sm">${s.ordersCount||0} · ${money(s.ordersValue)}</div><div class="t">הזמנות עבודה</div></div>
    </div>
    <div class="grid2">
      <div class="panel-box">
        <h3>משפך פייפליין</h3>
        ${STAGES.map(k=>{const n=s.byStatus[k]||0;return `
          <div class="funnel-row"><span class="lbl">${STAGE_HE[k]}</span>
          <div class="funnel-bar"><i style="width:${n/maxFunnel*100}%"></i></div>
          <span class="v">${n}</span></div>`;}).join('')}
      </div>
      <div class="panel-box">
        <h3>לידים חדשים — 14 ימים אחרונים</h3>
        <svg class="spark" viewBox="0 0 100 60" preserveAspectRatio="none">
          <polyline fill="none" stroke="#ff8a1a" stroke-width="1.5" points="${pts}"/>
        </svg>
        <div style="display:flex;gap:1.4rem;margin-top:1rem">
          <div><div class="n" style="font-size:1.3rem;font-weight:700;color:${s.tasksOverdue?'#D93A3A':'var(--led2)'}">${s.tasksOverdue}</div><div class="t muted">משימות באיחור</div></div>
          <div><div class="n" style="font-size:1.3rem;font-weight:700;color:var(--led2)">${s.tasksToday}</div><div class="t muted">משימות להיום</div></div>
        </div>
      </div>
    </div>`;
  refreshTaskBadge();
}

/* ---------- pipeline (kanban) ---------- */
async function loadPipeline(){
  const {leads}=await api('/api/leads');
  const cols=STAGES.map(st=>{
    const items=leads.filter(l=>l.status===st);
    const sum=items.reduce((a,l)=>a+Number(l.value||0),0);
    return `<div class="kan-col" data-stage="${st}" ondragover="kanOver(event)" ondragleave="kanLeave(event)" ondrop="kanDrop(event)">
      <h4>${STAGE_HE[st]} <span class="muted">${items.length}</span></h4>
      <div class="col-sum">${money(sum)}</div>
      ${items.map(l=>`
        <div class="kan-card" draggable="true" data-id="${l.id}" ondragstart="kanStart(event)" onclick="openLead(${l.id})">
          <div class="nm">${esc(l.name)}</div>
          <div class="meta"><span>${esc(l.assigned_name||'—')}</span>${l.value>0?`<span class="val">${money(l.value)}</span>`:''}</div>
        </div>`).join('')}
    </div>`;
  }).join('');
  $('#page-pipeline').innerHTML=`<h2 class="page-title">פייפליין</h2><div class="kanban">${cols}</div>`;
}
let dragId=null;
function kanStart(e){dragId=e.currentTarget.dataset.id;e.dataTransfer.effectAllowed='move';}
function kanOver(e){e.preventDefault();e.currentTarget.classList.add('dragover');}
function kanLeave(e){e.currentTarget.classList.remove('dragover');}
async function kanDrop(e){
  e.preventDefault();e.currentTarget.classList.remove('dragover');
  const stage=e.currentTarget.dataset.stage;
  if(!dragId)return;
  try{await api('/api/leads/'+dragId,{method:'PATCH',body:JSON.stringify({status:stage})});loadPipeline();refreshTaskBadge();}
  catch(err){toast(err.message);}
  dragId=null;
}

/* ---------- leads ---------- */
async function loadLeads(){
  selected.clear();
  const p=new URLSearchParams();if(leadFilter.status)p.set('status',leadFilter.status);if(leadFilter.q)p.set('q',leadFilter.q);
  const {leads}=await api('/api/leads?'+p);
  $('#page-leads').innerHTML=`
    <h2 class="page-title">לידים</h2>
    <div class="toolbar">
      <input class="search" id="q" placeholder="חיפוש שם / טלפון / תגית..." value="${esc(leadFilter.q)}">
      <button class="chip ${!leadFilter.status?'active':''}" onclick="setLeadStatus('')">הכול</button>
      ${STAGES.map(st=>`<button class="chip ${leadFilter.status===st?'active':''}" onclick="setLeadStatus('${st}')">${STAGE_HE[st]}</button>`).join('')}
      <a class="btn-ghost btn-sm" href="/api/leads/export.csv${leadFilter.status?'?status='+leadFilter.status:''}" style="text-decoration:none;margin-inline-start:auto">⬇ ייצוא CSV</a>
    </div>
    <table>
      <thead><tr><th style="width:28px"></th><th>שם</th><th>טלפון</th><th>שלב</th><th>שווי</th><th>תגיות</th><th>מטפל</th><th>התקבל</th></tr></thead>
      <tbody id="leads-body"></tbody>
    </table>
    <div id="bulkbar"></div>`;
  $('#leads-body').innerHTML=leads.map(l=>`
    <tr>
      <td onclick="event.stopPropagation()"><input type="checkbox" class="checkbox" onchange="toggleSel(${l.id},this.checked)"></td>
      <td onclick="openLead(${l.id})">${esc(l.name)}</td>
      <td onclick="openLead(${l.id})" dir="ltr">${esc(l.phone)}</td>
      <td onclick="openLead(${l.id})">${stChip(l.status)}</td>
      <td onclick="openLead(${l.id})">${l.value>0?money(l.value):'—'}</td>
      <td onclick="openLead(${l.id})">${(l.tags||'').split(',').filter(Boolean).map(t=>`<span class="tag">${esc(t.trim())}</span>`).join('')}</td>
      <td onclick="openLead(${l.id})">${esc(l.assigned_name||'—')}</td>
      <td onclick="openLead(${l.id})">${fmtDate(l.created_at)}</td>
    </tr>`).join('')||'<tr><td colspan="8" class="muted">אין לידים</td></tr>';
  let qT;$('#q').oninput=e=>{clearTimeout(qT);qT=setTimeout(()=>{leadFilter.q=e.target.value;loadLeads();},350);};
}
function setLeadStatus(s){leadFilter.status=s;loadLeads();}
function toggleSel(id,on){on?selected.add(id):selected.delete(id);renderBulk();}
function renderBulk(){
  const bb=$('#bulkbar');if(!bb)return;
  if(!selected.size){bb.innerHTML='';return;}
  bb.innerHTML=`<div class="bulkbar"><b>${selected.size}</b> נבחרו
    <select id="bulk-tpl" style="max-width:220px"><option value="">בחר תבנית מייל...</option>${TEMPLATES.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
    <button class="btn btn-sm" onclick="bulkSend()">שלח דיוור</button>
    <button class="btn-ghost btn-sm" onclick="selected.clear();loadLeads()">בטל</button></div>`;
}
async function bulkSend(){
  const tpl=$('#bulk-tpl').value;
  if(!tpl){toast('בחר תבנית');return;}
  if(!confirm(`לשלוח מייל ל-${selected.size} לידים?`))return;
  try{
    const r=await api('/api/leads/bulk-email',{method:'POST',body:JSON.stringify({lead_ids:[...selected],template_id:Number(tpl)})});
    toast(`נשלחו ${r.sent} · נכשלו ${r.failed} · דולגו ${r.skipped} (ללא מייל)`);
    selected.clear();loadLeads();
  }catch(e){toast(e.message);}
}

      <button class="btn btn-sm" onclick="addLeadTask(${l.id})">הוסף משימה</button>
      <div id="lead-tasks" style="margin-top:1rem">${renderLeadTasks(d.tasks,l.id)}</div>
    </div>
    <div id="d-email" class="tab-pane hidden">
      ${l.email?`
      <div class="field"><label>תבנית</label><select id="e-tpl" onchange="applyTpl()"><option value="">— ללא —</option>${TEMPLATES.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
      <div class="field"><label>נושא</label><input id="e-subj"></div>
      <div class="field"><label>תוכן</label><textarea id="e-body" rows="6"></textarea></div>
      <button class="btn" onclick="sendEmail(${l.id})">שלח מייל ללקוח ✉</button>`
      :'<p class="muted">ללקוח אין כתובת מייל — אפשר ליצור קשר בוואטסאפ מלמעלה</p>'}
    </div>`;
  $('#drawer-wrap').classList.remove('hidden');
}
function leadTab(e,id){
  document.querySelectorAll('#drawer .tabs button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  document.querySelectorAll('#drawer .tab-pane').forEach(p=>p.classList.add('hidden'));
  $('#'+id).classList.remove('hidden');
}
function closeDrawer(){$('#drawer-wrap').classList.add('hidden');}
async function saveLead(id){
  try{
    await api('/api/leads/'+id,{method:'PATCH',body:JSON.stringify({
      status:$('#f-status').value,assigned_to:$('#f-assigned').value||null,
      value:$('#f-value').value,expected_close:$('#f-close').value||null,tags:$('#f-tags').value})});
    toast('נשמר ✓');closeDrawer();
    const cur=document.querySelector('aside .nav.active').dataset.page;showPage(cur);
  }catch(e){toast(e.message);}
}
async function addNote(id){const v=$('#d-note').value.trim();if(!v)return;await api('/api/leads/'+id+'/notes',{method:'POST',body:JSON.stringify({body:v})});openLead(id);}
function renderLeadTasks(tasks,leadId){
  if(!tasks.length)return '<p class="muted">אין משימות לליד זה</p>';
  return tasks.map(t=>taskRow(t,leadId)).join('');
}
async function addLeadTask(id){
  const title=$('#t-title').value.trim();if(!title){toast('נדרשת כותרת');return;}
  await api('/api/tasks',{method:'POST',body:JSON.stringify({title,lead_id:id,user_id:$('#t-assignee').value||null,due_date:dateVals['ltd-due']||null,remind_at:dateVals['ltd-remind']||null})});
  openLead(id);refreshTaskBadge();
}
function applyTpl(){
  const t=TEMPLATES.find(x=>x.id===Number($('#e-tpl').value));
  if(t){$('#e-subj').value=t.subject;$('#e-body').value=t.body;}
}
async function sendEmail(id){
  try{await api('/api/leads/'+id+'/email',{method:'POST',body:JSON.stringify({subject:$('#e-subj').value,body:$('#e-body').value})});toast('המייל נשלח ✓');openLead(id);}
  catch(e){toast(e.message);}
}

/* ---------- quotes → work orders ---------- */
const QUOTE_ST={draft:'טיוטה',sent:'נשלחה',accepted:'אושרה',rejected:'נדחתה',ordered:'הזמנת עבודה'};
const QUOTE_ST_CLASS={draft:'st-new',sent:'st-contacted',accepted:'st-won',rejected:'st-lost',ordered:'st-quoted'};
const stChipQuote=s=>`<span class="status ${QUOTE_ST_CLASS[s]||''}">${QUOTE_ST[s]||s}</span>`;
let quoteItems=[],quoteEditId=null,quoteFilter={status:''};

async function loadQuotes(){
  const p=new URLSearchParams();if(quoteFilter.status)p.set('status',quoteFilter.status);
  const {quotes}=await api('/api/quotes?'+p);
  $('#page-quotes').innerHTML=`
    <h2 class="page-title">הצעות מחיר</h2>
    <div class="toolbar">
      <button class="btn btn-sm" onclick="editQuote()">+ הצעה חדשה</button>
      <button class="chip ${!quoteFilter.status?'active':''}" onclick="setQuoteFilter('')">הכול</button>
      ${Object.entries(QUOTE_ST).map(([k,v])=>`<button class="chip ${quoteFilter.status===k?'active':''}" onclick="setQuoteFilter('${k}')">${v}</button>`).join('')}
    </div>
    <table><thead><tr><th>מס׳</th><th>לקוח</th><th>כותרת</th><th>סה״כ</th><th>סטטוס</th><th>תאריך</th></tr></thead>
    <tbody>${quotes.map(q=>`<tr onclick="editQuote(${q.id})">
      <td dir="ltr">${esc(q.status==='ordered'&&q.order_number?('הז׳ '+q.order_number):q.number)}</td>
      <td>${esc(q.lead_name||'—')}</td><td>${esc(q.title||'')}</td>
      <td>${money(q.total)}</td><td>${stChipQuote(q.status)}</td><td>${fmtDate(q.created_at)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">אין הצעות מחיר עדיין</td></tr>'}</tbody></table>`;
}
function setQuoteFilter(s){quoteFilter.status=s;loadQuotes();}
function qItemsHtml(){
  return quoteItems.map((it,i)=>`<div class="row" style="gap:.4rem;margin-bottom:.4rem">
    <input style="flex:3;min-width:140px" placeholder="תיאור הפריט" value="${esc(it.desc)}" oninput="quoteItems[${i}].desc=this.value">
    <input style="flex:0;min-width:64px" type="number" min="0" placeholder="כמות" value="${it.qty}" oninput="quoteItems[${i}].qty=+this.value;recalcQuote()">
    <input style="flex:0;min-width:96px" type="number" min="0" placeholder="מחיר יח׳" value="${it.price}" oninput="quoteItems[${i}].price=+this.value;recalcQuote()">
    <button class="chip" style="flex:0" onclick="quoteItems.splice(${i},1);renderQuoteItems()">✕</button>
  </div>`).join('');
}
function renderQuoteItems(){$('#q-items').innerHTML=qItemsHtml();recalcQuote();}
function addQuoteRow(){quoteItems.push({desc:'',qty:1,price:0});renderQuoteItems();}
function recalcQuote(){
  const sub=quoteItems.reduce((s,it)=>s+(+it.qty||0)*(+it.price||0),0);
  const vr=+((document.getElementById('q-vat')||{}).value||0);
  const vat=sub*vr/100;const el=$('#q-totals');
  if(el)el.innerHTML=`סכום ביניים: <b>${money(sub)}</b> &nbsp;·&nbsp; מע״מ ${vr}%: <b>${money(vat)}</b> &nbsp;·&nbsp; <span style="color:var(--led2)">סה״כ: <b>${money(sub+vat)}</b></span>`;
}
async function editQuote(id,leadId){
  quoteEditId=id||null;
  let q=null;
  const leads=(await api('/api/leads')).leads;
  if(id){q=(await api('/api/quotes/'+id)).quote;quoteItems=(q.items||[]).map(it=>({desc:it.desc||'',qty:+it.qty||0,price:+it.price||0}));if(!quoteItems.length)quoteItems=[{desc:'',qty:1,price:0}];}
  else quoteItems=[{desc:'',qty:1,price:0}];
  const curLead=q?q.lead_id:(leadId||null);
  const leadOpts='<option value="">— בחר לקוח —</option>'+leads.map(l=>`<option value="${l.id}"${l.id===curLead?' selected':''}>${esc(l.name)}${l.phone?' · '+esc(l.phone):''}</option>`).join('');
  const validISO=q&&q.valid_until?q.valid_until.slice(0,10):'';
  const isOrder=q&&q.status==='ordered';
  $('#drawer').innerHTML=`
    <button class="close" onclick="closeDrawer()">✕</button>
    <h3>${id?('הצעת מחיר מס׳ '+q.number):'הצעת מחיר חדשה'} ${q?stChipQuote(q.status):''}</h3>
    ${isOrder?`<p class="muted" style="margin-top:.2rem">🔧 הומרה להזמנת עבודה מס׳ <b dir="ltr">${esc(q.order_number)}</b></p>`:''}
    <div class="field"><label>לקוח</label><select id="q-lead">${leadOpts}</select></div>
    <div class="field"><label>כותרת ההצעה</label><input id="q-title" value="${esc(q?q.title:'')}" placeholder="לדוגמה: מסך LED לחזית חנות"></div>
    <label class="muted" style="display:block;margin:.6rem 0 .3rem">פריטים</label>
    <div id="q-items">${qItemsHtml()}</div>
    <button class="chip" onclick="addQuoteRow()">+ הוסף שורה</button>
    <div class="row" style="margin-top:.8rem">
      <div class="field" style="flex:0;min-width:110px"><label>מע״מ %</label><input id="q-vat" type="number" value="${q?Number(q.vat_rate):18}" oninput="recalcQuote()"></div>
      ${dateField('q-valid','בתוקף עד',false,validISO)}
    </div>
    <div class="field"><label>הערות (תנאי תשלום, אספקה...)</label><textarea id="q-notes" rows="3">${esc(q?q.notes:'')}</textarea></div>
    <div id="q-totals" class="panel-box" style="margin:.6rem 0;text-align:center"></div>
    <div class="row">
      <button class="btn" onclick="saveQuote()">${id?'שמור':'צור הצעה'}</button>
      ${id?`<button class="btn-ghost" onclick="printQuote(${id})">🖨️ הדפסה/PDF</button>
        <button class="btn-ghost" onclick="sendQuote(${id})">✉️ שליחה</button>
        ${!isOrder?`<button class="btn-ghost" onclick="convertQuote(${id})">🔧 להזמנת עבודה</button>`:''}
        <button class="chip" onclick="delQuote(${id})">מחק</button>`:''}
    </div>`;
  $('#drawer-wrap').classList.remove('hidden');recalcQuote();
}
async function saveQuote(){
  const body={lead_id:$('#q-lead').value||null,title:$('#q-title').value,items:quoteItems,vat_rate:+$('#q-vat').value,notes:$('#q-notes').value,valid_until:dateVals['q-valid']||null};
  try{
    if(quoteEditId)await api('/api/quotes/'+quoteEditId,{method:'PATCH',body:JSON.stringify(body)});
    else await api('/api/quotes',{method:'POST',body:JSON.stringify(body)});
    toast('נשמר ✓');closeDrawer();loadQuotes();
  }catch(e){toast(e.message);}
}
async function sendQuote(id){
  if(!confirm('לשלוח את הצעת המחיר במייל ללקוח?'))return;
  try{await api('/api/quotes/'+id+'/send',{method:'POST'});toast('ההצעה נשלחה ✓');editQuote(id);}
  catch(e){toast(e.message);}
}
async function convertQuote(id){
  if(!confirm('להמיר את ההצעה להזמנת עבודה? פעולה זו תקצה מספר הזמנה ותסמן את הליד כ"נסגר בהצלחה".'))return;
  try{const r=await api('/api/quotes/'+id+'/convert',{method:'POST'});toast('נוצרה הזמנת עבודה מס׳ '+r.quote.order_number);editQuote(id);}
  catch(e){toast(e.message);}
}
function printQuote(id){window.open('/api/quotes/'+id+'/print','_blank');}
async function delQuote(id){if(!confirm('למחוק את ההצעה?'))return;await api('/api/quotes/'+id,{method:'DELETE'});closeDrawer();loadQuotes();}

/* ---------- tasks page ---------- */
let taskScope='open';
function taskRow(t,leadId){
  const overdue=!t.done&&t.due_date&&new Date(t.due_date)<new Date();
  const lid=leadId!==undefined?leadId:null;
  return `<div class="task-item ${t.done?'done':''} ${overdue?'overdue':''}">
    <div class="tt">
      <div style="font-weight:600">${esc(t.title)}</div>
      <div class="muted">${t.lead_name&&lid===null?'🔗 '+esc(t.lead_name)+' · ':''}יעד: ${t.due_date?fmtDate(t.due_date):'—'} · נוצר ע״י ${esc(t.creator_name||'—')}${t.remind_at?' · ⏰ '+fmtDT(t.remind_at):''}</div>
    </div>
    <select style="max-width:130px" onchange="setTaskStatus(${t.id},this.value,${lid})">${Object.entries(TASK_ST).map(([k,v])=>`<option value="${k}"${t.status===k?' selected':''}>${v}</option>`).join('')}</select>
    <select style="max-width:130px" onchange="reassignTask(${t.id},this.value,${lid})" title="שיוך">${userOpts(t.user_id)}</select>
    <button class="chip" onclick="setTaskReminder(${t.id},${lid})">⏰</button>
    <button class="chip" onclick="delTask(${t.id},${lid})">מחק</button>
  </div>`;
}
async function loadTasks(){
  const {tasks}=await api('/api/tasks?scope='+taskScope);
  $('#page-tasks').innerHTML=`
    <h2 class="page-title">משימות</h2>
    <div class="toolbar">
      ${[['open','פתוחות'],['today','להיום'],['overdue','באיחור'],['upcoming','עתידיות'],['all','הכול']].map(([k,v])=>`<button class="chip ${taskScope===k?'active':''}" onclick="setTaskScope('${k}')">${v}</button>`).join('')}
    </div>
    <div class="panel-box">
      <div class="field"><label>משימה חדשה</label><input id="nt-title" placeholder="לדוגמה: להתקשר בחזרה ללקוח"></div>
      <div class="row">
        <div class="field"><label>שיוך ל</label><select id="nt-assignee">${userOpts(ME.id)}</select></div>
        ${dateField('nt-due','תאריך יעד',false,'')}
        ${dateField('nt-remind','תזכורת (תאריך ושעה)',true,'')}
      </div>
      <button class="btn btn-sm" onclick="addTask()">הוסף משימה</button>
    </div>
    <div id="tasks-list">${tasks.map(t=>taskRow(t)).join('')||'<p class="muted">אין משימות</p>'}</div>`;
}
function setTaskScope(s){taskScope=s;loadTasks();}
async function addTask(){
  const title=$('#nt-title').value.trim();if(!title){toast('נדרשת כותרת');return;}
  await api('/api/tasks',{method:'POST',body:JSON.stringify({title,user_id:$('#nt-assignee').value||null,due_date:dateVals['nt-due']||null,remind_at:dateVals['nt-remind']||null})});
  loadTasks();refreshTaskBadge();
}
async function setTaskStatus(id,status,leadId){
  await api('/api/tasks/'+id,{method:'PATCH',body:JSON.stringify({status})});refreshTaskBadge();
  (leadId!==null&&leadId!==undefined)?openLead(leadId):loadTasks();
}
async function reassignTask(id,uid,leadId){
  await api('/api/tasks/'+id,{method:'PATCH',body:JSON.stringify({user_id:uid||null})});toast('המשימה הועברה');
  (leadId!==null&&leadId!==undefined)?openLead(leadId):loadTasks();
}
function setTaskReminder(id,leadId){
  openCal('tmp-remind-'+id,true,async iso=>{
    await api('/api/tasks/'+id,{method:'PATCH',body:JSON.stringify({remind_at:iso||null})});
    toast(iso?'תזכורת נקבעה':'תזכורת בוטלה');
    (leadId!==null&&leadId!==undefined)?openLead(leadId):loadTasks();
  });
}
async function delTask(id,leadId){
  await api('/api/tasks/'+id,{method:'DELETE'});refreshTaskBadge();
  (leadId!==null&&leadId!==undefined)?openLead(leadId):loadTasks();
}

/* ---------- templates ---------- */
async function loadTemplates(){
  TEMPLATES=(await api('/api/templates')).templates;
  $('#page-templates').innerHTML=`
    <h2 class="page-title">תבניות מייל</h2>
    <p class="muted" style="margin-bottom:1rem">אפשר להשתמש במשתנים: <code>{{name}}</code> <code>{{first_name}}</code> <code>{{phone}}</code> — יוחלפו אוטומטית לכל לקוח.</p>
    <button class="btn btn-sm" style="margin-bottom:1rem" onclick="editTemplate()">+ תבנית חדשה</button>
    <div>${TEMPLATES.map(t=>`
      <div class="panel-box" style="margin-bottom:.8rem">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><b>${esc(t.name)}</b><div class="muted">${esc(t.subject)}</div></div>
          <div><button class="chip" onclick="previewTemplate(${t.id})">תצוגה</button> <button class="chip" onclick="editTemplate(${t.id})">עריכה</button> <button class="chip" onclick="delTemplate(${t.id})">מחק</button></div>
        </div>
      </div>`).join('')||'<p class="muted">אין תבניות עדיין</p>'}</div>`;
}
function editTemplate(id){
  const t=TEMPLATES.find(x=>x.id===id)||{name:'',subject:'',body:''};
  $('#drawer').innerHTML=`
    <button class="close" onclick="closeDrawer()">✕</button>
    <h3>${id?'עריכת תבנית':'תבנית חדשה'}</h3>
    <div class="field"><label>שם התבנית</label><input id="tp-name" value="${esc(t.name)}"></div>
    <div class="field"><label>נושא</label><input id="tp-subject" value="${esc(t.subject)}"></div>
    <div class="field"><label>תוכן</label><textarea id="tp-body" rows="8">${esc(t.body)}</textarea></div>
    <button class="btn" onclick="saveTemplate(${id||0})">שמור</button>`;
  $('#drawer-wrap').classList.remove('hidden');
}
async function saveTemplate(id){
  const body={name:$('#tp-name').value,subject:$('#tp-subject').value,body:$('#tp-body').value};
  try{
    if(id)await api('/api/templates/'+id,{method:'PATCH',body:JSON.stringify(body)});
    else await api('/api/templates',{method:'POST',body:JSON.stringify(body)});
    toast('נשמר ✓');closeDrawer();loadTemplates();
  }catch(e){toast(e.message);}
}
async function delTemplate(id){if(!confirm('למחוק את התבנית?'))return;await api('/api/templates/'+id,{method:'DELETE'});loadTemplates();}
function previewTemplate(id){
  const t=TEMPLATES.find(x=>x.id===id);if(!t)return;
  const demo={name:'ישראל ישראלי',email:'demo@example.com',phone:'050-0000000'};
  const body=t.body.replace(/\{\{\s*name\s*\}\}/g,demo.name).replace(/\{\{\s*first_name\s*\}\}/g,'ישראל').replace(/\{\{\s*phone\s*\}\}/g,demo.phone).replace(/\{\{\s*email\s*\}\}/g,demo.email);
  $('#drawer').innerHTML=`
    <button class="close" onclick="closeDrawer()">✕</button>
    <h3>${esc(t.name)}</h3>
    <p class="muted" style="margin-bottom:.8rem">נושא: ${esc(t.subject)}</p>
    <iframe style="width:100%;height:60vh;border:1px solid var(--line);border-radius:12px;background:#fff" srcdoc="${esc(body)}"></iframe>`;
  $('#drawer-wrap').classList.remove('hidden');
}

/* ---------- users ---------- */
async function loadUsers(){
  USERS=(await api('/api/users')).users;
  $('#page-users').innerHTML=`
    <h2 class="page-title">משתמשים</h2>
    <div class="toolbar">
      <input id="u-email" placeholder="email@example.com" style="max-width:200px" dir="ltr">
      <input id="u-first" placeholder="שם פרטי" style="max-width:120px">
      <input id="u-last" placeholder="שם משפחה" style="max-width:120px">
      <input id="u-phone" placeholder="טלפון" style="max-width:130px" dir="ltr">
      <select id="u-role" style="max-width:110px"><option value="agent">נציג</option><option value="admin">מנהל</option></select>
      <button class="btn btn-sm" onclick="addUser()">הוסף</button>
    </div>
    <table>
      <thead><tr><th>אימייל</th><th>שם</th><th>טלפון</th><th>תפקיד</th><th>פעיל</th><th>פעולות</th></tr></thead>
      <tbody>${USERS.map(u=>`<tr>
        <td dir="ltr">${esc(u.email)}</td><td>${esc(u.name)}</td><td dir="ltr">${esc(u.phone)||'—'}</td>
        <td>${u.role==='admin'?'מנהל':'נציג'}</td><td>${u.is_active?'✓':'✗'}</td>
        <td style="white-space:nowrap">
          <button class="chip" onclick="toggleUser(${u.id},${!u.is_active})">${u.is_active?'השבת':'הפעל'}</button>
          <button class="chip" onclick="resetUser(${u.id})">איפוס סיסמה</button>
          <button class="chip" onclick="delUser(${u.id})">מחק</button>
        </td></tr>`).join('')}</tbody>
    </table>`;
}
async function addUser(){
  try{
    const d=await api('/api/users',{method:'POST',body:JSON.stringify({email:$('#u-email').value,first_name:$('#u-first').value,last_name:$('#u-last').value,phone:$('#u-phone').value,role:$('#u-role').value})});
    toast('משתמש נוצר. סיסמה זמנית: '+d.tempPassword);loadUsers();
  }catch(e){toast(e.message);}
}
async function toggleUser(id,a){try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({is_active:a})});loadUsers();}catch(e){toast(e.message);}}
async function resetUser(id){try{const d=await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({reset_password:true})});toast('סיסמה זמנית: '+d.tempPassword);}catch(e){toast(e.message);}}
async function delUser(id){if(!confirm('למחוק את המשתמש?'))return;try{await api('/api/users/'+id,{method:'DELETE'});loadUsers();}catch(e){toast(e.message);}}

/* ---------- settings ---------- */
function loadSettings(){
  $('#page-settings').innerHTML=`
    <h2 class="page-title">הגדרות</h2>
    <div class="panel-box" style="max-width:420px">
      <h3>החלפת סיסמה</h3>
      <div class="field"><label>סיסמה נוכחית</label><input id="s-current" type="password" dir="ltr"></div>
      <div class="field"><label>סיסמה חדשה (10+ תווים)</label><input id="s-next" type="password" dir="ltr"></div>
      <button class="btn" onclick="changePass()">עדכן סיסמה</button>
    </div>
    <div class="panel-box" style="max-width:420px">
      <h3>מחובר כ</h3>
      <p>${esc(ME.name||ME.email)} · ${ME.role==='admin'?'מנהל':'נציג'}</p>
    </div>`;
}
async function changePass(){
  try{await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({current:$('#s-current').value,next:$('#s-next').value})});toast('הסיסמה עודכנה ✓');$('#s-current').value='';$('#s-next').value='';}
  catch(e){toast(e.message);}
}

/* ---------- boot ---------- */
api('/api/auth/me').then(d=>{ME=d.user;enterApp();}).catch(()=>{});
